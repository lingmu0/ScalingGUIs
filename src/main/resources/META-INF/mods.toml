modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
clientSideOnly=true

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Kenny Pasley (Spazley), 1.20.1 port contributors"
description='''
Decouples screen, HUD and tooltip scales and supports per-screen scaling rules.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="${jei_version_range}"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="obscure_tooltips"
mandatory=false
versionRange="${obscure_version_range}"
ordering="AFTER"
side="CLIENT"
